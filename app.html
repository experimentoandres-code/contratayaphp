<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Contratá Ya</title>
<meta name="theme-color" content="#0B1620">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/isotipo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contratá Ya">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-body">

<!-- ══════ BARRA SUPERIOR ══════ -->
<header class="barra" id="barra" hidden>
  <a class="barra-marca" href="/">
    <img src="/img/isotipo.svg" alt="Contratá Ya" width="21" height="21">
  </a>
  <span class="barra-titulo" id="barraTitulo">Buscar</span>
  <button class="barra-btn" id="btnZona">
    <span id="zonaActual">Elegir zona</span>
  </button>
</header>

<main id="escena"></main>

<!-- ══════ NAVEGACIÓN INFERIOR ══════ -->
<nav class="tabs" id="tabs" hidden>
  <button class="tab" data-vista="buscar">
    <svg viewBox="0 0 24 24" class="tab-i"><path d="M4 5h16M4 12h16M4 19h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    <span>Buscar</span>
  </button>
  <button class="tab" data-vista="matches">
    <svg viewBox="0 0 24 24" class="tab-i"><path d="M12 20s-7-4.6-7-9.5A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.5C19 15.4 12 20 12 20z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
    <span>Matches</span>
    <b class="tab-globo" id="globoMatches" hidden>0</b>
  </button>
  <button class="tab" data-vista="beneficios">
    <svg viewBox="0 0 24 24" class="tab-i"><path d="M4 9h16v11H4zM4 9l2-4h12l2 4M12 5v15" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
    <span>Beneficios</span>
  </button>
  <button class="tab" data-vista="perfil">
    <svg viewBox="0 0 24 24" class="tab-i"><circle cx="12" cy="8.5" r="3.6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <span>Perfil</span>
  </button>
</nav>

<!-- ══════ CAPAS ══════ -->
<div class="hoja" id="hoja" hidden>
  <div class="hoja-fondo" data-cerrar></div>
  <div class="hoja-panel" id="hojaPanel"></div>
</div>

<div class="brindis" id="brindis" hidden></div>

<script src="/js/data.js"></script>
<script src="/js/instalar.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
