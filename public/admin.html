<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Contratá Ya</title>
<meta name="theme-color" content="#0B1620">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/isotipo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/admin.css?v=22">
</head>
<body class="admin-body">

<!-- Portón: mientras no se confirme que sos administrador, no se ve nada -->
<div class="porton" id="porton">
  <div class="porton-caja">
    <h1>Panel de administración</h1>
    <p id="portonTexto">Verificando la sesión…</p>
    <div id="portonAcciones"></div>
  </div>
</div>

<div class="admin" id="admin" hidden>

  <!-- ══════ BARRA LATERAL ══════ -->
  <aside class="lateral">
    <div class="lateral-marca">
      <div class="marca-nombre">CONTRATÁ YA</div>
      <div class="marca-sub">Panel de administración</div>
    </div>

    <nav class="lateral-nav" id="nav">
      <button data-sec="resumen" class="activo">Resumen</button>
      <button data-sec="documentos">Documentos</button>
      <button data-sec="actividad">Actividad</button>
      <button data-sec="usuarios">Usuarios</button>
      <button data-sec="planes">Planes</button>
      <button data-sec="pedidos">Pedidos</button>
      <button data-sec="trabajos">Matches y chats</button>
      <button data-sec="calificaciones">Calificaciones</button>
      <button data-sec="anunciantes">Anunciantes</button>
      <button data-sec="creativos">Creativos</button>
      <button data-sec="moderacion">Moderación</button>
    </nav>

    <div class="lateral-pie">
      <span class="lateral-avatar" id="adminInicial">A</span>
      <div>
        <div class="lateral-nombre" id="adminNombre">—</div>
        <div class="lateral-rol">Administrador</div>
      </div>
    </div>

    <button class="lateral-salir" id="salirPanel">Volver a la app</button>
  </aside>

  <!-- ══════ CONTENIDO ══════ -->
  <div class="contenido">

    <header class="cabecera">
      <div class="cabecera-titulo">
        <h1 id="secTitulo">Resumen</h1>
        <p id="secBajada">Altas, matches y trabajos del período</p>
        <p class="marca-tiempo" id="marcaTiempo"></p>
      </div>

      <div class="periodo" id="periodo">
        <button data-dias="7">7 días</button>
        <button data-dias="30" class="activo">30 días</button>
        <button data-dias="90">90 días</button>
      </div>

      <button class="btn-recargar" id="recargar" type="button">Actualizar</button>
    </header>

    <div class="cuerpo" id="cuerpo">
      <p class="cargando">Cargando…</p>
    </div>

  </div>
</div>

<!-- ══════ FICHA LATERAL ══════ -->
<div class="ficha" id="ficha" hidden>
  <div class="ficha-velo" data-cerrar-ficha></div>
  <aside class="ficha-panel" id="fichaPanel"></aside>
</div>

<div class="brindis" id="brindis" hidden></div>

<script src="/js/data.js?v=65"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
<script src="/js/admin.js?v=72"></script>
<script src="/js/admin-matches.js?v=2"></script>
<script src="/js/admin-chat.js?v=2"></script>
<script src="/js/admin-docs.js?v=2"></script>
</body>
</html>
